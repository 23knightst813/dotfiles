# ==============================================================================
# Keyd Configuration: Dell XPS 13 9350 (Lunar Lake)
#
# macOS-style modifiers:
#   Physical Left Ctrl -> Super (Command) for Hyprland/WM shortcuts
#   Physical Left Win  -> Control          for native app/TTY shortcuts
#   Physical Left Alt  -> Option           for word-wise navigation/deletion
#
# The physical Ctrl key is translated to Ctrl+<key> for the common macOS
# Cmd shortcuts, so copy/paste/etc. work in GUI apps.  The physical Win key
# stays a real Control key, except Super+V (and Super+Alt+V) which pass
# Super+V to Hyprland to open the clipboard manager.
# ==============================================================================

[ids]
0001:0001
*

[main]
# Dell XPS Copilot key -> F23 (Antigravity HUD)
leftmeta+leftshift+f23 = f23

# macOS-style modifier swap (below XKB, so it also works on TTYs)
leftcontrol = layer(meta)
leftmeta = layer(win_ctrl)

# Physical Left Alt (Mac Option) key
leftalt = layer(opt_layer)

# ------------------------------------------------------------------------------
# Mac Option (Alt) Layer: Word-by-Word Navigation & Deletion
# ------------------------------------------------------------------------------
[opt_layer:A]
left = C-left
right = C-right
backspace = C-backspace
delete = C-delete

[opt_layer+shift]
left = C-S-left
right = C-S-right

# ------------------------------------------------------------------------------
# Physical Left Super (Win) layer: acts as Control, except V opens clipboard
# ------------------------------------------------------------------------------
[win_ctrl:C]
v = M-v

[win_ctrl+opt_layer]
v = M-A-v

# ------------------------------------------------------------------------------
# Mac Command layer (physical Left Ctrl)
#
# Translate the common macOS Cmd+<letter> shortcuts to Ctrl+<letter> for the
# focused app.  Q, H, M, Space, Tab, Return, arrows, numbers and punctuation
# are deliberately left alone so they reach Hyprland as Super+... for window
# management.
# ------------------------------------------------------------------------------
[meta]
a = C-a
c = C-c
f = C-f
g = C-g
i = C-i
j = C-j
k = C-k
l = C-l
n = C-n
o = C-o
p = C-p
r = C-r
s = C-s
t = C-t
u = C-u
v = C-v
w = C-w
x = C-x
y = C-y
z = C-z
